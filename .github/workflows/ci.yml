name: CI

# Keep the runner and Xcode version in sync with release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Test on the release toolchain
        run: |
          plutil -lint Support/Info.plist
          swift test

      - name: Universal release build
        run: make build UNIVERSAL=1
