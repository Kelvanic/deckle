name: CI

# Runs the release workflow's verification on the release toolchain, so code
# the Xcode 15 compiler rejects is caught in review instead of at tag time.
# The Windows job lints, tests, and builds the Rust port under windows/.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Test on the release toolchain
        run: |
          plutil -lint Support/Info.plist
          swift test

      - name: Universal release build
        run: make build UNIVERSAL=1

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # bash stops at the first failing command; pwsh would only report
        # the last one.
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: deckle-windows
          path: windows/target/release/deckle.exe
          if-no-files-found: error

      - name: Smoke test and screenshots
        run: pwsh -NoProfile -File scripts/smoke.ps1 -Exe target/release/deckle.exe -OutDir ../screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deckle-windows-screenshots
          path: screenshots
          if-no-files-found: ignore

  # TEMPORARY, removed before merge: copies the screenshots to a branch so
  # they can be committed to docs/.
  windows-screenshots:
    needs: windows
    if: always() && github.event_name == 'pull_request' && github.head_ref == 'windows-support'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: deckle-windows-screenshots
          path: screenshots

      - name: Push to ci/windows-screenshots
        if: hashFiles('screenshots/*.png') != ''
        working-directory: screenshots
        run: |
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Windows screenshots from run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/windows-screenshots
