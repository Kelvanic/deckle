name: CI

# Runs the release workflow's verification on the release toolchain, so code
# the Xcode 15 compiler rejects is caught in review instead of at tag time.
# The Windows job lints, tests, and builds the Rust port under windows/.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Test on the release toolchain
        run: |
          plutil -lint Support/Info.plist
          swift test

      - name: Universal release build
        run: make build UNIVERSAL=1

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # bash stops at the first failing command; pwsh would only report
        # the last one.
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: deckle-windows
          path: windows/target/release/deckle.exe
          if-no-files-found: error
