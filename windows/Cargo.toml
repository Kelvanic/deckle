[package]
name = "deckle-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Deckle for Windows: deterministic paper texture over every display."
license = "MIT"
publish = false

[lib]
name = "deckle"
path = "src/lib.rs"

[[bin]]
name = "deckle"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The renderer's FFT and stamping loops are far too slow unoptimized; tests
# render real 512 x 512 fields.
[profile.dev]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
